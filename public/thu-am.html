<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phòng thu — Góc Phố Việt</title>
<style>
:root{--bg:#fbf3e4;--card:#fffaf0;--ink:#3b2a1e;--mut:#8a7460;--line:#e6d5bb;--acc:#c8552b;--ok:#3f8f5a}
@media(prefers-color-scheme:dark){:root{--bg:#1f1812;--card:#2a211a;--ink:#f3e7d6;--mut:#b49f88;--line:#44372b;--acc:#f08a5d;--ok:#6fc48b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px 16px 120px;max-width:720px;margin-inline:auto}
h1{font-size:22px;margin:4px 0}p{margin:6px 0;color:var(--mut)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0;position:sticky;top:0;background:var(--bg);z-index:2}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;min-height:44px}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}.tab.full::after{content:" ✓"}
.hint{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.line{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.line.done{border-color:var(--ok)}.txt{font-size:18px;font-weight:600}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
button.b{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;min-height:48px;background:var(--acc);color:#fff}
button.b.rec{background:#b3261e;animation:p 1s infinite}button.b.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
@keyframes p{50%{opacity:.6}}audio{height:40px;flex:1;min-width:160px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:center}
.bar span{color:var(--mut)}#err{color:#b3261e;font-weight:600}
</style></head><body>
<h1>Phòng thu Góc Phố Việt</h1>
<p>Chọn nhân vật, bấm <b>Thu</b>, đọc câu thoại như đang nói chuyện thật, bấm <b>Dừng</b>. Nghe lại, chưa ưng thì thu lại. Bản thu được giữ trong máy này tới khi bạn tải về.</p>
<p>Mẹo: ngồi chỗ yên tĩnh, để điện thoại cách miệng một gang tay, đọc tự nhiên chứ đừng đọc như đọc bài.</p>
<p id="err"></p>
<div class="tabs" id="tabs"></div><div id="hint" class="hint"></div><div id="list"></div>
<div class="bar"><span id="count"></span><button class="b" id="dl">Tải tất cả về (.zip)</button></div>

tắc nha!"}, {"k": "c763f69e", "t": "Cho em một ly Bạc xỉu nha!"}, {"k": "0350569e", "t": "Cho em một ly Trà đào nha!"}]}, {"id": "kh_hs2", "name": "Khách học sinh nữ", "hint": "Nữ rất trẻ", "lines": [{"k": "e2176c34", "t": "Cho em một ly Cà phê đen nha!"}, {"k": "853bc303", "t": "Cho em một ly Cà phê sữa nha!"}, {"k": "03898479", "t": "Cho em một ly Trà tắc nha!"}, {"k": "37ae6225", "t": "Cho em một ly Bạc xỉu nha!"}, {"k": "48586eb1", "t": "Cho em một ly Trà đào nha!"}]}, {"id": "kh_ship1", "name": "Khách shipper 1", "hint": "Nam trẻ, nói nhanh", "lines": [{"k": "296f82df", "t": "Cho tôi một ly Cà phê đen nha!"}, {"k": "d88542d4", "t": "Cho tôi một ly Cà phê sữa nha!"}, {"k": "669581ec", "t": "Cho tôi một ly Trà tắc nha!"}, {"k": "5371283c", "t": "Cho tôi một ly Bạc xỉu nha!"}, {"k": "8a940634", "t": "Cho tôi một ly Trà đào nha!"}]}, {"id": "kh_ship2", "name": "Khách shipper 2", "hint": "Nam, giọng khác shipper 1", "lines": [{"k": "954ecb00", "t": "Cho tôi một ly Cà phê đen nha!"}, {"k": "6094a4e7", "t": "Cho tôi một ly Cà phê sữa nha!"}, {"k": "d755be05", "t": "Cho tôi một ly Trà tắc nha!"}, {"k": "31b23c01", "t": "Cho tôi một ly Bạc xỉu nha!"}, {"k": "bec0e265", "t": "Cho tôi một ly Trà đào nha!"}]}, {"id": "kh_dl1", "name": "Khách ghé quán nữ trẻ", "hint": "Nữ trẻ, nhẹ nhàng", "lines": [{"k": "92e137e1", "t": "Cho tôi một ly Cà phê đen nha!"}, {"k": "1a394d0a", "t": "Cho tôi một ly Cà phê sữa nha!"}, {"k": "9a6cf1f2", "t": "Cho tôi một ly Trà tắc nha!"}, {"k": "c6484a36", "t": "Cho tôi một ly Bạc xỉu nha!"}, {"k": "3cb2ec26", "t": "Cho tôi một ly Trà đào nha!"}]}, {"id": "kh_dl2", "name": "Khách ghé quán nam lớn tuổi", "hint": "Nam lớn tuổi, trầm", "lines": [{"k": "1722b92e", "t": "Cho tôi một ly Cà phê đen nha!"}, {"k": "19bce3b9", "t": "Cho tôi một ly Cà phê sữa nha!"}, {"k": "ef1803c7", "t": "Cho tôi một ly Trà tắc nha!"}, {"k": "763617ff", "t": "Cho tôi một ly Bạc xỉu nha!"}, {"k": "677c65eb", "t": "Cho tôi một ly Trà đào nha!"}]}, {"id": "kh_dl3", "name": "Khách ghé quán nữ trung niên", "hint": "Nữ trung niên", "lines": [{"k": "577e3d3f", "t": "Cho tôi một ly Cà phê đen nha!"}, {"k": "234f4474", "t": "Cho tôi một ly Cà phê sữa nha!"}, {"k": "91ed558c", "t": "Cho tôi một ly Trà tắc nha!"}, {"k": "214d339c", "t": "Cho tôi một ly Bạc xỉu nha!"}, {"k": "3fba5994", "t": "Cho tôi một ly Trà đào nha!"}]}];
const $=(id)=>document.getElementById(id);
let db,cur=0,rec=null,stream=null;const have=new Map();
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open("gpv-thu-am",1);r.onupgradeneeded=()=>r.result.createObjectStore("clips");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(mode)=>db.transaction("clips",mode).objectStore("clips");
const put=(k,blob)=>new Promise((res)=>{try{const q=tx("readwrite").put(blob,k);q.onsuccess=q.onerror=()=>res()}catch{res()}});
const del=(k)=>new Promise((res)=>{try{const q=tx("readwrite").delete(k);q.onsuccess=q.onerror=()=>res()}catch{res()}});
const loadAll=()=>new Promise((res)=>{try{const c=tx("readonly").openCursor();c.onsuccess=()=>{const cu=c.result;if(cu){have.set(cu.key,cu.value);cu.continue()}else res()};c.onerror=()=>res()}catch{res()}});
const ext=(b)=>b.type.includes("mp4")?"m4a":b.type.includes("ogg")?"ogg":"webm";
function tabs(){const t=$("tabs");t.replaceChildren();DATA.forEach((c,i)=>{const b=document.createElement("button");b.className="tab"+(i===cur?" on":"")+(c.lines.every((l)=>have.has(l.k))?" full":"");b.textContent=c.name;b.onclick=()=>{stop();cur=i;render()};t.appendChild(b)});
 const n=DATA.reduce((s,c)=>s+c.lines.filter((l)=>have.has(l.k)).length,0),all=DATA.reduce((s,c)=>s+c.lines.length,0);$("count").textContent=`Đã thu ${n}/${all} câu`}
function render(){tabs();const c=DATA[cur];$("hint").textContent=`Vai ${c.name} — nên là giọng: ${c.hint}. ${c.lines.length} câu.`;const box=$("list");box.replaceChildren();
 c.lines.forEach((l)=>{const d=document.createElement("div");d.className="line"+(have.has(l.k)?" done":"");const t=document.createElement("div");t.className="txt";t.textContent=l.t;d.appendChild(t);
  const r=document.createElement("div");r.className="row";const b=document.createElement("button");b.className="b";b.textContent=have.has(l.k)?"Thu lại":"Thu";b.onclick=()=>toggle(l,b);r.appendChild(b);
  if(have.has(l.k)){const a=document.createElement("audio");a.controls=true;a.src=URL.createObjectURL(have.get(l.k));r.appendChild(a);const x=document.createElement("button");x.className="b sec";x.textContent="Xoá";x.onclick=async()=>{have.delete(l.k);await del(l.k);render()};r.appendChild(x)}
  d.appendChild(r);box.appendChild(d)})}
function stop(){if(rec&&rec.state!=="inactive")rec.stop()}
async function toggle(l,btn){if(rec&&rec.state!=="inactive"){rec.stop();return}
 try{stream=stream||await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,channelCount:1}})}catch(e){$("err").textContent="Chưa được phép dùng micro. Hãy bấm Cho phép khi trình duyệt hỏi, rồi thử lại.";return}
 $("err").textContent="";const chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=(e)=>e.data.size&&chunks.push(e.data);
 rec.onstop=async()=>{const blob=new Blob(chunks,{type:rec.mimeType||"audio/webm"});have.set(l.k,blob);await put(l.k,blob);render()};
 rec.start();btn.textContent="Dừng";btn.classList.add("rec")}
// zip không nén
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return(u)=>{let c=~0;for(let i=0;i<u.length;i++)c=t[(c^u[i])&255]^(c>>>8);return(~c)>>>0}})();
async function zip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
 for(const f of files){const name=enc.encode(f.name),data=new Uint8Array(await f.blob.arrayBuffer()),crc=CRC(data);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
  parts.push(h.buffer,name,data);cen.push(c.buffer,name);off+=30+name.length+data.length}
 const cs=cen.reduce((s,p)=>s+p.byteLength,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,e.buffer],{type:"application/zip"})}
$("dl").onclick=async()=>{stop();const files=[];for(const c of DATA)for(const l of c.lines)if(have.has(l.k)){const b=have.get(l.k);files.push({name:`${c.id}/${l.k}.${ext(b)}`,blob:b})}
 if(!files.length){$("err").textContent="Chưa có câu nào được thu.";return}
 const a=document.createElement("a");a.href=URL.createObjectURL(await zip(files));a.download="giong-goc-pho-viet.zip";a.click()};
(async()=>{if(!navigator.mediaDevices||!window.MediaRecorder)$("err").textContent="Trình duyệt này không thu âm được. Hãy mở bằng Chrome (Android) hoặc Safari (iPhone).";
 try{db=await open();await loadAll()}catch{}render()})();
